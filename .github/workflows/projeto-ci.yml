name: CI Makerpass

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ] 

jobs:
  
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt
      
      - name: Análise Estática com Bandit voltada para segurança
        run: |
          bandit -r autenticacao makerpass agendamento -ll --format txt

      - name: Lint rápido com Ruff
        uses: astral-sh/ruff-action@v1
        with:
          args: "check --verbose"

      - name: Verificar Padrão de Código com Pylint
        run: pylint autenticacao makerpass agendamento
          
      - name: Verificar dependências deprecadas
        run: |
          pip install deprecated-checker
          deprecated-checker check 

      - name: Verificar código potencialmente deprecado
        run: |
          pip install vulture
          vulture . --min-confidence 80 

      - name: Executar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'makerpass-project'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            
      - name: Upload do Relatório de Scan
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      - name: Instalar Graphviz (Dependência do Sistema)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Gerar Diagrama de Classes UML
        run: |
          python manage.py graph_models autenticacao makerpass agendamento -o diagrama_classes.png

      - name: Upload do Diagrama como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: diagrama-uml-classes
          path: diagrama_classes.png

  analyze:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3















